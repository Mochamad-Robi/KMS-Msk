<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — KMS Online</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 360px;
        }
        img { width: 64px; height: 64px; margin-bottom: 16px; }
        h1 { color: #7f0d0d; font-size: 18px; margin: 0 0 8px; }
        p { color: #6b7280; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
        button {
            background: #7f0d0d;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="/assets/logoapk2.png" alt="Logo">
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>Sepertinya kamu sedang offline. Coba periksa koneksi internet kamu dan muat ulang halaman.</p>
        <button onclick="window.location.reload()">Muat Ulang</button>
    </div>
</body>
</html>
